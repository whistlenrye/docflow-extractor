services:
  - type: web
    name: docflow-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m playwright install chromium
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
