services:
  - type: web
    name: docflow-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python -m playwright install chromium && python -m playwright install-deps chromium
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: FORM_TARGET_URL
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.cache/playwright
